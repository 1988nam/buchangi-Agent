name = "buchangi"
main = "worker/buchangi-worker.js"
compatibility_date = "2024-11-01"

# ── 자동매매 실행 스케줄 (Cron Trigger) ─────────────────────────────
# Cloudflare cron은 UTC 기준. 국내 장중 09:00~15:20 KST = 00:00~06:20 UTC.
# 평일(월~금) UTC 00~06시에 5분 간격으로 워커를 깨운다.
# (워커가 다시 한번 KST 거래시간 09:00~15:20을 확인하고, 벗어나면 스킵)
[triggers]
crons = ["*/5 0-6 * * 1-5"]

# ── 상태 저장용 KV (설정/포지션/일일카운터/매매로그) ────────────────
# 배포 전 1회: wrangler kv namespace create BUCHANGI_KV
# 출력된 id를 아래 id에 붙여넣는다.
[[kv_namespaces]]
binding = "BUCHANGI_KV"
id = "5549b1898b8a4d6cb96617fa1c75afcd"

# ── 비챙이(Bichangi) 이벤트 PUSH용 서비스 바인딩 ────────────────────
# 같은 계정 *.workers.dev 간 URL fetch는 타깃에 닿지 않으므로 서비스 바인딩으로 호출.
[[services]]
binding = "SVC_BICHANGI"
service = "bichangi-agent"

# ── 비밀값 (코드/리포에 넣지 말 것) ─────────────────────────────────
# 대시보드 관리 API 인증 토큰:
#   wrangler secret put ADMIN_TOKEN
# (KIS appkey/secret/계좌는 대시보드에서 입력 → KV에 저장됨. 응답에는 마스킹되어 노출 안 함)

# ── 정적 대시보드 동시 호스팅(선택) ─────────────────────────────────
# 워커가 루트(/)에서 대시보드 HTML/JS/CSS도 서빙하도록 assets를 연결할 수 있다.
# (대시보드를 Cloudflare Pages/GitHub Pages 등 별도 호스팅한다면 이 블록은 불필요)
# [assets]
# directory = "./public"
